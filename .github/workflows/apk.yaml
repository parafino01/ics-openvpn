name: APK

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  build:
    name: Build UiOvpn23
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          cache: gradle
          distribution: temurin

      - uses: android-actions/setup-android@v3

      - name: Build Release APK
        run: ./gradlew assembleUiOvpn23Release

      - name: Gerar assinatura automática e assinar APK
        run: |
          keytool -genkeypair -v -keystore auto.jks -keyalg RSA -keysize 2048 -validity 10000 -alias app -storepass 123456 -keypass 123456 -dname "CN=OpenVPN, OU=App, O=VPN, L=City, S=State, C=MZ"
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -n 1)
          $APKSIGNER sign --ks auto.jks --ks-key-alias app --ks-pass pass:123456 --key-pass pass:123456 --out app-assinado.apk main/build/outputs/apk/uiOvpn23/release/*.apk

      - name: Upload APK Assinado
        uses: actions/upload-artifact@v4
        with:
          name: apk-pronto
          path: app-assinado.apk
